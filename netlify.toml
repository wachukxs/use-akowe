[build]
  command = "npm run build"
  # Publish directory is managed automatically by Netlify's Next.js adapter.

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# Force clear cache on every build to avoid stale dependency issues
[build.processing]
  skip_processing = false

# Redirect www and http to canonical https://useakowe.com
[[redirects]]
  from = "https://www.useakowe.com/*"
  to = "https://useakowe.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.useakowe.com/*"
  to = "https://useakowe.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://useakowe.com/*"
  to = "https://useakowe.com/:splat"
  status = 301
  force = true

# Make sure you don't have a /blog route in your Next.js app (no app/blog/page.tsx)
# Proxy /blog to external blog subdomain (keeps URL as akowe.com/blog)
[[redirects]]
  from = "/blog"
  to = "https://use-akowe.com.chuks.name.ng"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://use-akowe.com.chuks.name.ng/:splat"
  status = 200
  force = true

