[build]
  command = "yarn build"

[build.environment]
  NODE_VERSION = "20"
  YARN_FLAGS = "--frozen-lockfile"

# Cache node_modules and Next.js compiler output between builds.
# This is the primary lever for reducing build minutes (credits).
# Only do "Clear cache and deploy" in the Netlify UI when you actually
# change dependencies — not on every push.
[build.cache]
  paths = [
    "node_modules",
    ".next/cache"
  ]

[build.processing]
  skip_processing = false

# Redirect www and http to canonical https://useakowe.com
[[redirects]]
  from = "https://www.useakowe.com/*"
  to = "https://useakowe.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.useakowe.com/*"
  to = "https://useakowe.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://useakowe.com/*"
  to = "https://useakowe.com/:splat"
  status = 301
  force = true

# Make sure you don't have a /blog route in your Next.js app (no app/blog/page.tsx)
# Proxy /blog to external blog subdomain (keeps URL as akowe.com/blog)
[[redirects]]
  from = "/blog"
  to = "https://use-akowe.com.chuks.name.ng"
  status = 200
  force = true

[[redirects]]
  from = "/blog/*"
  to = "https://use-akowe.com.chuks.name.ng/:splat"
  status = 200
  force = true

# Redirect locale-less pSEO URLs (from old Google index / external links) to
# canonical /en/... versions. These routes are excluded from next-intl
# middleware (to reduce serverless invocations on Netlify), so without these
# Netlify-level rules they would 404 instead of redirecting.
[[redirects]]
  from = "/guides"
  to = "/en/guides"
  status = 301

[[redirects]]
